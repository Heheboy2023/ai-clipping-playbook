[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clipping-playbook-clipkit"
version = "0.2.0"
description = "Local, testable companion tools for Clip It & Cash In"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vidlly Media" }]
dependencies = ["Pillow>=11.0,<13", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
transcription = ["openai-whisper>=20250625"]

[project.scripts]
clipkit = "clipkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: invokes installed media tools on generated fixtures",
]
